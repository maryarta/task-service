services:
  postgres:
    image: postgres:16
    container_name: task-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: task-service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: task-service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task-service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres@123

volumes:
  postgres_data: